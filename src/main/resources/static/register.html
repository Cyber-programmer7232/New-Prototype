<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Register – LabourLink</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <a href="/" class="ll-brand" style="display:block;margin-bottom:1.5rem;">⚡ LabourLink</a>
      <div class="auth-title">Create account</div>
      <p style="color:var(--text-muted);font-size:.9rem;margin-bottom:1.2rem;">Join thousands on LabourLink</p>

      <div class="role-tabs" id="roleTabs">
        <button type="button" class="role-tab active" data-role="WORKER" id="tabWorker">🔨 Worker</button>
        <button type="button" class="role-tab" data-role="CONTRACTOR" id="tabContractor">🏗️ Contractor</button>
      </div>

      <div id="errorMsg" style="display:none;background:rgba(255,107,107,.15);border:1px solid var(--accent);border-radius:.6rem;padding:.75rem 1rem;margin-bottom:1rem;font-size:.85rem;color:var(--accent);"></div>

      <form id="registerForm">
        <input type="hidden" id="role" value="WORKER"/>

        <div class="ll-form-group">
          <label class="ll-label" for="name">Full Name</label>
          <input class="ll-input" type="text" id="name" placeholder="Your name" required/>
        </div>
        <div class="ll-form-group">
          <label class="ll-label" for="email">Email</label>
          <input class="ll-input" type="email" id="email" placeholder="you@example.com" required/>
        </div>
        <div class="ll-form-group">
          <label class="ll-label" for="phone">Phone</label>
          <input class="ll-input" type="tel" id="phone" placeholder="+91 9876543210"/>
        </div>
        <div class="ll-form-group">
          <label class="ll-label" for="password">Password</label>
          <input class="ll-input" type="password" id="password" placeholder="Min 8 characters" required/>
        </div>
        <div class="ll-form-group">
          <label class="ll-label" for="location">Location / City</label>
          <input class="ll-input" type="text" id="location" placeholder="e.g. Mumbai, Maharashtra"/>
        </div>

        <!-- Worker specific -->
        <div id="workerFields">
          <div class="ll-form-group">
            <label class="ll-label" for="skills">Skills (comma separated)</label>
            <input class="ll-input" type="text" id="skills" placeholder="e.g. Plumbing, Electrical, Painting"/>
          </div>
          <div class="ll-form-group">
            <label class="ll-label" for="bio">Bio</label>
            <textarea class="ll-input" id="bio" rows="2" placeholder="Brief intro..." style="resize:vertical;"></textarea>
          </div>
        </div>

        <!-- Contractor specific -->
        <div id="contractorFields" style="display:none;">
          <div class="ll-form-group">
            <label class="ll-label" for="company">Company Name</label>
            <input class="ll-input" type="text" id="company" placeholder="Your company (optional)"/>
          </div>
        </div>

        <button type="submit" class="btn-primary-ll" style="width:100%;padding:.75rem;font-size:1rem;" id="regBtn">
          Create Account
        </button>
      </form>

      <hr class="divider"/>
      <p style="text-align:center;color:var(--text-muted);font-size:.9rem;">
        Already have an account? <a href="login.html" style="color:var(--primary);font-weight:600;">Sign In</a>
      </p>
    </div>
  </div>

  <div id="toast"><span id="toastIcon"></span><span id="toastMsg"></span></div>
  <script src="js/auth.js"></script>
  <script>
    // Pre-select role from query param
    const params = new URLSearchParams(location.search);
    if (params.get('role') === 'CONTRACTOR') setRole('CONTRACTOR');

    document.getElementById('roleTabs').addEventListener('click', e => {
      const tab = e.target.closest('.role-tab');
      if (tab) setRole(tab.dataset.role);
    });

    function setRole(role) {
      document.getElementById('role').value = role;
      document.querySelectorAll('.role-tab').forEach(t => t.classList.toggle('active', t.dataset.role === role));
      document.getElementById('workerFields').style.display    = role === 'WORKER' ? '' : 'none';
      document.getElementById('contractorFields').style.display= role === 'CONTRACTOR' ? '' : 'none';
    }

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('regBtn');
      btn.textContent = 'Creating...'; btn.disabled = true;
      const errEl = document.getElementById('errorMsg'); errEl.style.display = 'none';
      const role = document.getElementById('role').value;
      const body = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        password: document.getElementById('password').value,
        role, location: document.getElementById('location').value,
      };
      if (role === 'WORKER') {
        body.skills = document.getElementById('skills').value;
        body.bio = document.getElementById('bio').value;
      } else {
        body.companyName = document.getElementById('company').value;
      }
      try {
        const data = await apiPost('/api/auth/register', body);
        localStorage.setItem('token', data.token);
        localStorage.setItem('role', data.role);
        localStorage.setItem('userId', data.userId);
        localStorage.setItem('name', data.name);
        showToast('Account created! Welcome 🎉', 'success');
        setTimeout(() => {
          window.location.href = data.role === 'WORKER' ? 'worker-dashboard.html' : 'contractor-dashboard.html';
        }, 800);
      } catch (err) {
        errEl.textContent = err.message || 'Registration failed';
        errEl.style.display = 'block';
        btn.textContent = 'Create Account'; btn.disabled = false;
      }
    });
  </script>
</body>
</html>
